spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:LDOE_helper}
spring.datasource.username=${DB_USERNAME:test_role}
spring.datasource.password=${DB_PASSWORD:admin}

# update — автоматически добавляет новые колонки/таблицы при старте,
# не удаляет существующие данные. Для production заменить на validate + Liquibase/Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=disabled
spring.security.user.password=disabled

server.port=${SERVER_PORT:8080}

spring.web.resources.static-locations=classpath:/static/,file:uploads/

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

jwt.secret=${JWT_SECRET:my_super_secret_key_which_must_be_at_least_32_chars_long}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:12000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}