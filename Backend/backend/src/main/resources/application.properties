spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/LDOE_helper
spring.datasource.username=test_role
spring.datasource.password=admin

# update — автоматически добавляет новые колонки/таблицы при старте,
# не удаляет существующие данные. Для production заменить на validate + Liquibase/Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=disabled
spring.security.user.password=disabled

spring.web.resources.static-locations=classpath:/static/,file:uploads/

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB